# News per stock and day for the S&P 1500 research (algo/wide_news.py): Alpaca's news archive, 2015 -> now.
# Research data only: nothing here trades. The first download takes about ten hours at the default
# pace (half of Alpaca's request limit, so the trading runs that share the key are never held up): each
# run goes on where the last one stopped. Once every month is there, a run refreshes the running month
# in a few minutes. The table lives in the Actions cache (not in git); the nightly finder reads it.
name: news-backfill

on:
  schedule:
    - cron: "17 0 * * *"  # before the nightly finder (03:37 UTC)
  workflow_dispatch:
    inputs:
      minutes:
        description: "stop after this many minutes"
        default: "320"
      pace:
        description: "seconds between requests"
        default: "0.6"

permissions:
  contents: read

concurrency:
  group: news-backfill
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PAPER_BRANCH || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/wide/news
          key: wide-news-none
          restore-keys: wide-news-
      - name: Download the months that are missing
        env:  # market data only (account A's keys, read only, no trading call)
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m algo.wide_news --minutes ${{ inputs.minutes || '320' }} --pace ${{ inputs.pace || '0.6' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/wide/news
          key: wide-news-${{ github.run_id }}
