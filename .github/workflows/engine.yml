# The all-day engine (algo/live.py), SHADOW MODE: it decides the moment new bars
# are final and logs what it would do; it sends no order. The hourly workflow
# (paper-hourly) still does the real trading.
#
# A GitHub job lasts at most 6 hours, so the US session is covered by two jobs:
# the morning one waits for the open, the afternoon one takes over (the
# concurrency group makes it start when the first one ends).
# Log: paper/engine/<date>.md, saved to the repo after every decision.
name: engine

on:
  # Started by the outside timer (cron-job.org) at 9:15 and 15:05 New York, Monday to Friday:
  # GitHub's own schedule started the morning shift ~5 hours late on 2 Oct.
  workflow_dispatch:
    inputs:
      minutes:
        description: "run for this many minutes"
        default: "345"

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_B_API_KEY_ID: ${{ secrets.ALPACA_B_API_KEY_ID }}
      ALPACA_B_API_SECRET_KEY: ${{ secrets.ALPACA_B_API_SECRET_KEY }}
      ALPACA_C_API_KEY_ID: ${{ secrets.ALPACA_C_API_KEY_ID }}
      ALPACA_C_API_SECRET_KEY: ${{ secrets.ALPACA_C_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PAPER_BRANCH || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/*_alpaca.csv
            data/news
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-
      - name: Git identity (the engine saves its log during the day)
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
      - name: Run the engine (shadow)
        run: python -m algo.live --minutes "${{ inputs.minutes || '345' }}"
      - name: Save the engine log to the repo
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper/engine
          # commit what is new; also push earlier commits the engine could not push during the day
          git diff --cached --quiet || git commit -m "Engine log $(date -u +'%Y-%m-%d %H:%M') UTC"
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          [ "$(git rev-list --count @{u}..HEAD 2>/dev/null || echo 1)" = "0" ] && exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 3)); done
          exit 1
