# Nightly strategy finder: new families first, then rounds of improved children of the best
# candidates (aimed at why they failed). Research only: nothing here trades or touches Alpaca.
# Every attempt is written to paper/finder/registry.csv (the deflated Sharpe bar rises with it).
# The vault period stays sealed: only `python -m algo.finder vault <id>`, run by hand once per
# candidate that passed every gate, ever loads it.
name: finder

on:
  schedule:
    - cron: "37 3 * * *"  # 23:37 / 22:37 New York: markets closed, no trading run competes for the runner
  workflow_dispatch:
    inputs:
      rounds:
        description: "loop rounds"
        default: "4"

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PAPER_BRANCH || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the prices the hourly job downloaded (read only: the finder never downloads)
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/*_alpaca.csv
            data/news
            data/social
          key: market-data-none
          restore-keys: market-data-
      # S&P 1500 daily bars (Alpaca market data: account A's keys, read only, no trading call) and any
      # newly published quarter of SEC insider trades. If it fails, the hourly families still run.
      - uses: actions/cache@v4
        with:
          path: |
            data/wide/daily.csv.gz
            data/wide/insider.csv.gz
            data/wide/insider_quarters.txt
            data/wide/ml_scores_*.pkl
            data/wide/ml_insider_*.pkl
            data/wide/earnings.csv.gz
            data/wide/short_volume.csv.gz
            data/wide/short_volume_days.txt
          key: wide-data-${{ github.run_id }}
          restore-keys: wide-data-
      - name: Update the S&P 1500 research data
        continue-on-error: true
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m algo.wide
      - name: Run the loop
        env:  # market data only (the hourly bars are brought up to date); no trading call
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m algo.finder loop --rounds ${{ inputs.rounds || '4' }}
      # every strategy that passed all the gates takes its one vault test (the user's standing go);
      # one that passes it starts forward paper trading, followed every night on new data
      - name: Vault test for new graduates, then forward paper trading
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python -m algo.finder promote
          python -m algo.forward
          python -m algo.finder report
      - name: Save the registry and report
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            # rows added elsewhere meanwhile (a local run) are merged in, never overwritten
            git fetch -q origin "$branch"
            git show "origin/$branch:paper/finder/registry.csv" > "$RUNNER_TEMP/remote.csv" 2>/dev/null || true
            python -m algo.finder merge "$RUNNER_TEMP/remote.csv"
            python -m algo.finder report
            git add paper/finder paper/forward data/wide/members.csv
            git diff --cached --quiet || git commit -q -m "finder: nightly loop $(date -u +'%Y-%m-%d')"
            git checkout -q -- .  # other files the run touched (downloaded data) are not saved here
            git rebase -X theirs -q "origin/$branch" && git push -q && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 3))
          done
          exit 1
      - name: Alert the phone if the finder failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >
          python -c "from algo import notify; notify.send('finder run failed',
          'See GitHub Actions run ${{ github.run_id }}.', 'warning', 'default')"
