# Hourly paper trading: each account trades the hour that just closed and
# mirrors it on its own Alpaca paper account with real stop / target orders.
#
#   A  paper/    secrets ALPACA_API_KEY_ID,   ALPACA_API_SECRET_KEY    (PA32CKBVJRGL)
#   B  paper/B/  secrets ALPACA_B_API_KEY_ID, ALPACA_B_API_SECRET_KEY  (PA3F9NT51E8I)
#   C  paper/C/  secrets ALPACA_C_API_KEY_ID, ALPACA_C_API_SECRET_KEY  (PA36I46L8ZXT)
# Each account only ever uses its own keys, and the sync refuses to send if the
# keys belong to another Alpaca account than the folder's config says.
# Optional: secret NTFY_TOPIC (phone notifications), variable PAPER_BRANCH.
# Scheduled workflows only run from the repository's default branch.
name: paper-hourly

on:
  schedule:
    # :20 past every hour: Alpaca's free plan serves stock data 15 minutes late,
    # so the hour that just ended is complete by then (GitHub may start a few minutes late).
    - cron: "20 * * * *"
    # backup slot: GitHub's schedule is best-effort and sometimes skips runs. A second
    # run in the same hour changes nothing unless something new happened (replay).
    - cron: "50 * * * *"
    # before the US open (9:05 and 9:12 New York, summer and winter time): stock orders go
    # to the 9:30 opening auction; three chances with the :20 run in case GitHub skips one
    - cron: "5,12 13,14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Download prices and news once for all accounts (Alpaca allows 200 data
  # requests a minute: three accounts downloading at once hit that limit).
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: paper-data
      cancel-in-progress: false
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PAPER_BRANCH || github.ref_name }}  # the branch's latest state, not the trigger's commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            data/*_alpaca.csv
            data/news
            data/social
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-
      - name: Download what is missing
        run: python -m algo.fetch
      # Crowd mood from StockTwits: recorded only, no trading uses it yet. Never blocks trading.
      - name: Record StockTwits counts
        continue-on-error: true
        run: python -m algo.social
      - name: Save the StockTwits counts to the repo (once a day)
        continue-on-error: true
        run: |
          [ "$(date -u +%H)" = "21" ] || exit 0
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/social
          git diff --cached --quiet && exit 0
          git commit -m "StockTwits counts $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 3)); done
      - name: Alert the phone if the download failed (no account trades this run)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >
          python -c "from algo import notify; notify.send('data download failed: no trading this run',
          'See GitHub Actions run ${{ github.run_id }}.', 'warning', 'high')"

  trade:
    needs: data
    strategy:
      fail-fast: false  # one account failing never stops the others
      matrix:
        include:
          - account: A
            folder: ""
            update: python -m algo.paper update
          - account: B
            folder: B
            update: python -m algo.paper update
          - account: C
            folder: C
            update: python -m algo.paper update
          # D: early test of the most active 13/14 candidate, insider + low short selling (daily runner)
          - account: D
            folder: D
            update: python -m algo.runner update --no-fetch  # filings + FINRA: workflow insider-backfill
          # E: the finder's best candidate on the S&P 1500 (daily runner, algo/runner.py)
          - account: E
            folder: E
            update: python -m algo.runner update --no-fetch  # filings: workflow insider-backfill
    concurrency:
      group: paper-trading-${{ matrix.account }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45  # the first run after a universe change downloads its history
    defaults:
      run:
        shell: bash  # with pipefail: a failed step is not hidden by `| tee`
    env:
      PAPER_ACCOUNT: ${{ matrix.folder }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}  # optional: phone notifications (algo/notify.py)
    steps:
      - name: Use this account's own Alpaca keys
        env:
          KEY_A: ${{ secrets.ALPACA_API_KEY_ID }}
          SECRET_A: ${{ secrets.ALPACA_API_SECRET_KEY }}
          KEY_B: ${{ secrets.ALPACA_B_API_KEY_ID }}
          SECRET_B: ${{ secrets.ALPACA_B_API_SECRET_KEY }}
          KEY_C: ${{ secrets.ALPACA_C_API_KEY_ID }}
          SECRET_C: ${{ secrets.ALPACA_C_API_SECRET_KEY }}
          KEY_D: ${{ secrets.ALPACA_D_API_KEY_ID }}
          SECRET_D: ${{ secrets.ALPACA_D_API_SECRET_KEY }}
          KEY_E: ${{ secrets.ALPACA_E_API_KEY_ID }}
          SECRET_E: ${{ secrets.ALPACA_E_API_SECRET_KEY }}
        run: |
          key_var="KEY_${{ matrix.account }}"; secret_var="SECRET_${{ matrix.account }}"
          if [ -z "${!key_var}" ] || [ -z "${!secret_var}" ]; then
            echo "::error::Alpaca keys for account ${{ matrix.account }} are missing (see the table at the top of this file)."
            exit 1
          fi
          { echo "ALPACA_API_KEY_ID=${!key_var}"; echo "ALPACA_API_SECRET_KEY=${!secret_var}"; } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PAPER_BRANCH || github.ref_name }}  # the branch's latest state, not the trigger's commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Account name (for notifications)
        run: echo "PAPER_ACCOUNT_NAME=$(python -c "import json;print(json.load(open('paper/${{ matrix.folder }}/config.json'.replace('//','/'))).get('name','${{ matrix.account }}'))")" >> "$GITHUB_ENV"

      # The data job's download (only bars newer than it are fetched here).
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/*_alpaca.csv
            data/news
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Paper account (trade the new bars)
        run: ${{ matrix.update }}

      - name: Mirror on Alpaca (market orders + stops / targets)
        run: python -m algo.alpaca sync --send | tee alpaca_sync.txt

      # Alpaca must hold what the plan wants, every position covered by a stop: if not, phone alert
      - name: Check Alpaca matches the plan
        continue-on-error: true
        run: python -m algo.alpaca verify --alert

      - name: Alert the phone if this run failed
        if: failure()
        run: >
          python -c "from algo import notify; notify.send('[${{ env.PAPER_ACCOUNT_NAME || matrix.account }}] trading run failed',
          'See GitHub Actions run ${{ github.run_id }}. Stops are put back automatically when the Alpaca step fails.', 'warning', 'high')"

      - name: Summary
        if: always()
        run: |
          cat "paper/${{ matrix.folder }}/status.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          { echo; echo '## Alpaca'; echo '```'; cat alpaca_sync.txt 2>/dev/null || echo "no sync this run"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save status to the repo
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add "paper/${{ matrix.folder }}"
          git diff --cached --quiet && exit 0
          git commit -m "Paper account ${{ matrix.account }} $(date -u +'%Y-%m-%d %H:%M') UTC"
          # the three accounts push at about the same time: retry with a random pause
          # two runs can overlap (GitHub's schedule + the outside timer): on a clash this run's newer status wins
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 3)); done
          exit 1

  # Account F: four option playbooks on the stock signals (algo/options.py). Runs after A has committed
  # its new plan; option orders only go out while the US market is open.
  options:
    needs: [data, trade]
    if: always() && needs.data.result == 'success'
    concurrency:
      group: paper-trading-F
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_ACCOUNT: F
      PAPER_ACCOUNT_NAME: F – Options
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_F_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_F_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PAPER_BRANCH || github.ref_name }}  # includes A's plan just committed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the hourly bars the data job downloaded (for the bearish signals and daily trends)
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/*_alpaca.csv
            data/news
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-
      - name: Option playbooks (calls, puts, put and call spreads)
        run: python -m algo.options sync --send | tee options_sync.txt
      - name: Alert the phone if this run failed
        if: failure()
        run: >
          python -c "from algo import notify; notify.send('[F – Options] run failed',
          'See GitHub Actions run ${{ github.run_id }}. Calls have no broker stop: the loss is capped at the premium.', 'warning', 'high')"
      - name: Summary
        if: always()
        run: |
          cat paper/F/status.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          { echo; echo '```'; cat options_sync.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save status to the repo
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper/F
          git diff --cached --quiet && exit 0
          git commit -m "Paper account F $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 3)); done
          exit 1
