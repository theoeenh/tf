# One-off / on-demand: recent Form 4 filings (after the last published SEC quarter) for one sector,
# from the SEC daily indexes. Resumes from data/wide/insider_recent_days.txt. Research data only: no
# trading call, no Alpaca keys.
name: insider-backfill

on:
  workflow_dispatch:
    inputs:
      sector:
        description: "sector (Wikipedia GICS name)"
        default: "Industrials"
      days:
        description: "calendar days back from today (90 covers the insider-cluster window)"
        default: "100"

permissions:
  contents: write

concurrency:
  group: insider-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the filings
        env:
          SEC_PACE: "1.0"  # one request a second: faster paces get the runner blocked within minutes
        run: |
          python -c "
          import logging; logging.basicConfig(level=logging.INFO, format='%(levelname)s %(message)s')
          from algo import wide
          t = [a for a, s in wide.sectors().items() if s == '${{ inputs.sector }}']
          df = wide.update_insider_recent(days=${{ inputs.days }}, tickers=t); print('rows', len(df))"
          tail -2 data/wide/insider_recent_days.txt
      - name: Save
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/wide/insider_recent.csv.gz data/wide/insider_recent_days.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "Recent Form 4 filings (${{ inputs.sector }}): backfill from GitHub Actions"
          git checkout -q -- .
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
