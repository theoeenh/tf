# Twice a day and on demand: recent Form 4 filings (after the last published SEC quarter) for one sector,
# from the SEC daily indexes. Resumes from data/wide/insider_recent_days.txt. Research data only: no
# trading call, no Alpaca keys.
name: insider-backfill

on:
  schedule:
    - cron: "41 10 * * *"  # before the US open: the previous days' filings, for account E
    - cron: "41 22 * * *"  # after the close
  workflow_dispatch:
    inputs:
      sector:
        description: "sector (Wikipedia GICS name)"
        default: "Industrials"  # account E's strategy
      days:
        description: "calendar days back from today (90 covers the insider-cluster window)"
        default: "100"

permissions:
  contents: write

concurrency:
  group: insider-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the filings
        timeout-minutes: 280  # stops before the job's limit so the progress is still saved
        continue-on-error: true
        env:
          SEC_PACE: "1.0"  # one request a second: faster paces get the runner blocked within minutes
          SEC_PATIENT: "1"  # when blocked, wait it out (10 minutes at a time) instead of stopping
        run: |
          python -c "
          import logging; logging.basicConfig(level=logging.INFO, format='%(levelname)s %(message)s')
          from algo import wide
          t = [a for a, s in wide.sectors().items() if s == '${{ inputs.sector || 'Industrials' }}']
          df = wide.update_insider_recent(days=${{ inputs.days || '100' }}, tickers=t); print('rows', len(df))"
          tail -2 data/wide/insider_recent_days.txt
      - name: Save
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          mine="$RUNNER_TEMP/mine"; mkdir -p "$mine"
          cp data/wide/insider_recent.csv.gz data/wide/insider_recent_days.txt "$mine/" 2>/dev/null || exit 0
          for i in 1 2 3 4 5; do
            # the file is compressed (git cannot merge it): take the branch as it is now, add our rows
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python -c "from algo import wide; print(wide.merge_insider_recent('$mine/insider_recent.csv.gz', '$mine/insider_recent_days.txt'), 'rows')"
            git add data/wide/insider_recent.csv.gz data/wide/insider_recent_days.txt
            git diff --cached --quiet && exit 0
            git commit -q -m "Recent Form 4 filings (${{ inputs.sector || 'Industrials' }}): backfill from GitHub Actions"
            git push -q && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
